<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico?v=storage-1" sizes="any" />
    <link rel="icon" type="image/png" href="/icon.png?v=storage-1" sizes="256x256" />
    <link rel="apple-touch-icon" href="/icon.png?v=storage-1" />
    <title>物品管理</title>
    <style>
      body:has(.entry-page) { margin: 0; }
      .entry-page { min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #172026; background: #f5f6f6; font: 400 16px/1.5 "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei UI", sans-serif; }
      .entry-page * { box-sizing: border-box; }
      .entry-card { display: grid; gap: 16px; width: min(100%, 400px); padding: 32px; background: #fff; border: 1px solid rgba(23,32,38,.11); border-radius: 12px; }
      .entry-card h1 { margin: 0; font-size: 24px; font-weight: 600; }
      .entry-field { display: grid; gap: 4px; }
      .entry-field span { color: #59656b; font-size: .875rem; font-weight: 500; }
      .entry-field input { width: 100%; min-height: 44px; padding: 8px 12px; color: #172026; background: #fff; border: 1px solid rgba(23,32,38,.22); border-radius: 8px; font: inherit; }
      .entry-card :focus-visible { outline: 2px solid #0f766e; outline-offset: 2px; }
      .entry-card button { min-height: 44px; padding: 8px 12px; color: #fff; background: #0f766e; border: 0; border-radius: 8px; font: inherit; font-size: .875rem; font-weight: 600; cursor: pointer; }
      .entry-card button:disabled { opacity: .52; cursor: not-allowed; }
      .entry-card [data-entry-retry] { color: #59656b; background: transparent; }
      .entry-card [data-entry-feedback] { margin: 0; color: #59656b; font-size: .875rem; }
      .entry-card [role=alert] { color: #b42318; }
      .entry-card [hidden] { display: none; }
    </style>
    <script type="module" src="/src/renderer/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <main class="entry-page">
        <form class="entry-card" method="post" id="entry-login">
          <h1>物品管理</h1>
          <label class="entry-field"><span>访问密码</span><input id="entry-password" type="password" autocomplete="current-password" autofocus required /></label>
          <p data-entry-feedback role="status" aria-live="polite" hidden></p>
          <button type="submit" disabled>登录</button>
          <button type="button" data-entry-retry hidden>重试</button>
          <noscript>请启用 JavaScript 后登录。</noscript>
        </form>
      </main>
    </div>
  </body>
  </html>
